<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoteNest - Online Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">N</div>
                <span>NoteNest</span>
            </div>

            <nav class="sidebar-nav">

                <button class="nav-item active" id="allNotesBtn">
                    <span>📝</span>
                    All Notes
                </button>

                <button class="nav-item" id="favoritesBtn">
                    <span>⭐</span>
                    Favorites
                </button>

            </nav>

            <div class="sidebar-bottom">
                <div class="storage-info">
                    <span>☁️</span>
                    <div>
                        <strong>Cloud Notes</strong>
                        <small>AWS powered</small>
                    </div>
                </div>
            </div>

        </aside>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">

            <!-- HEADER -->

            <header class="topbar">

                <div>
                    <h1>My Notes</h1>
                    <p>Capture your thoughts and ideas.</p>
                </div>

                <button class="new-note-btn" id="newNoteBtn">
                    <span>+</span>
                    New Note
                </button>

            </header>


            <!-- SEARCH -->

            <div class="search-container">

                <span class="search-icon">🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search your notes..."
                >

            </div>


            <!-- STATUS -->

            <div id="statusMessage" class="status-message"></div>


            <!-- NOTES -->

            <section id="notesContainer" class="notes-grid">

                <!-- Notes will be loaded here by JavaScript -->

            </section>

        </main>

    </div>


    <!-- ================= NOTE MODAL ================= -->

    <div class="modal-overlay" id="noteModal">

        <div class="note-modal">

            <div class="modal-header">

                <div>
                    <h2 id="modalTitle">Create New Note</h2>
                    <p>Save your note to the cloud.</p>
                </div>

                <button class="close-btn" id="closeModal">
                    ×
                </button>

            </div>


            <form id="noteForm">

                <input type="hidden" id="noteId">


                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter note title"
                    required
                >


                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your note here..."
                    required
                ></textarea>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Note
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
